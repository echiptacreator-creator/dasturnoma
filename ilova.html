<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Andijon PFK — jonli panel</title>
<style>
 html,body{margin:0;height:100%;background:#021B53;color:#fff;
   font-family:-apple-system,Segoe UI,Roboto,sans-serif}
 .q{height:100%;display:flex;flex-direction:column;align-items:center;
   justify-content:center;gap:18px;text-align:center;padding:24px}
 .a{width:44px;height:44px;border-radius:50%;border:4px solid #ffffff22;
   border-top-color:#EB1F28;animation:s 0.9s linear infinite}
 @keyframes s{to{transform:rotate(360deg)}}
 h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.2px}
 p{font-size:13px;color:#ffffff99;margin:0;max-width:280px;line-height:1.5}
</style></head><body>
<div class="q"><div class="a" id="a"></div>
<h1 id="h">Jonli panel ochilmoqda…</h1>
<p id="p">Bir soniya kutib turing.</p></div>
<script>
var RAW = "https://raw.githubusercontent.com/echiptacreator-creator/dasturnoma/main/manzil.json";
function xato(matn){
  var a=document.getElementById("a"); if(a) a.style.display="none";
  document.getElementById("h").textContent="Jonli panel hozircha yopiq";
  document.getElementById("p").textContent=matn;
}
function ol(u){
  return fetch(u,{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("javob "+r.status);
    return r.json();
  }).then(function(j){ return (j && j.url) || ""; });
}
(function(){
  var t = Date.now();
  ol("manzil.json?t="+t).catch(function(){ return ol(RAW+"?t="+t); })
   .then(function(u){
     if(!u){ xato("Manzil hali e'lon qilinmagan."); return; }
     var p = new URLSearchParams(location.search);
     var yol = p.get("yol") || "";
     var mid = p.get("mid") || "";
     var m = u.replace(/\/$/,"");
     /* Ruxsat etilgan sahifalar. Ro'yxat sabab: bu yerga
        tashqaridan kelgan matn qo'yiladi va u manzilga qo'shiladi —
        begona joyga yo'naltirib yuborilmasin. */
     var YOL = {mvp: "/mvp", intervyu: "/intervyu", kalibr: "/kalibr"};
     m += YOL[yol] || "/";
     if(mid) m += "?mid=" + encodeURIComponent(mid);
     location.replace(m + location.hash);
   })
   .catch(function(e){
     xato("Panel serveri hozir o'chiq. Birozdan keyin urinib ko'ring.");
   });
})();
</script></body></html>
