<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>malades.bola — portfolio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:'MonumentExtended';src:url('shrift/MonumentExtended-Medium.ttf') format('truetype');font-weight:700;font-display:swap}@font-face{font-family:'MonumentExtended';src:url('shrift/MonumentExtended-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
:root{
  --fon:#0F1115;
  --qatlam:#161A20;
  --chiziq:#232830;
  --matn:#F4F6F8;
  --xira:#8B93A1;
  --urgu:#FF5500;
  --urgu-toq:#CC4400;
  --ikki:#00E5FF;
  --ijobiy:#2ED573;
  --salbiy:#FF4757;
  --r:16px;
  --r-katta:22px;
  --sarlavha:'MonumentExtended','Space Grotesk','Gilroy',sans-serif;
  --matn-shrift:'Inter','Gilroy',-apple-system,'Segoe UI',system-ui,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--fon);color:var(--matn);
  font-family:var(--matn-shrift);overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
img{display:block;max-width:100%}
button{font-family:inherit}

/* ---------- BOSH ---------- */
.bosh{padding:22px 18px 14px;position:relative;overflow:hidden}
.bosh::after{content:"";position:absolute;left:-25%;top:-140%;
  width:150%;height:230%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,85,0,.16),transparent 70%)}
.mark{display:flex;align-items:baseline;gap:9px;position:relative}
.mark .nom{font-family:var(--sarlavha);font-size:21px;letter-spacing:-.5px;
  font-weight:700}
.mark .nuqta{width:7px;height:7px;border-radius:2px;background:var(--urgu);
  transform:translateY(-3px)}
.kasb{margin-top:7px;font-size:10.5px;color:var(--xira);letter-spacing:2.6px;
  text-transform:uppercase;position:relative}
.shior{margin-top:12px;font-size:14px;line-height:1.45;color:var(--matn);
  position:relative;max-width:19em}
.shior b{color:var(--urgu);font-weight:600}
.raqamlar{display:flex;gap:22px;margin-top:16px;position:relative}
.raqam b{display:block;font-family:var(--sarlavha);font-size:19px;
  font-weight:700;letter-spacing:-.5px}
.raqam span{font-size:9.5px;color:var(--xira);letter-spacing:1.5px;
  text-transform:uppercase}

/* ---------- ISHONCH ---------- */
.ishonch{padding:0 0 4px;position:relative}
.ishonch .sarl{font-size:9.5px;color:var(--xira);letter-spacing:2px;
  text-transform:uppercase;padding:0 18px 8px}
.ishonch .qator{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  padding:0 18px 14px}
.ishonch .qator::-webkit-scrollbar{display:none}
.ishonch b{flex:0 0 auto;font-size:11.5px;font-weight:600;padding:7px 11px;
  border-radius:9px;background:var(--qatlam);border:1px solid var(--chiziq);
  color:#c3cad4;white-space:nowrap}
.ishonch b:first-child{border-color:rgba(0,229,255,.35);color:var(--ikki)}

/* ---------- QIDIRUV ---------- */
.qidiruv{padding:2px 18px 10px;position:relative}
.qidiruv input{width:100%;padding:12px 14px 12px 40px;border-radius:13px;
  background:var(--qatlam);border:1px solid var(--chiziq);color:var(--matn);
  font-size:14.5px;font-family:inherit;outline:none}
.qidiruv input::placeholder{color:var(--xira)}
.qidiruv input:focus{border-color:var(--urgu)}
.qidiruv .belgi{position:absolute;left:31px;top:50%;transform:translateY(-60%);
  color:var(--xira);font-size:15px;pointer-events:none}
.qidiruv .toza{position:absolute;right:29px;top:50%;
  transform:translateY(-60%);color:var(--xira);font-size:17px;cursor:pointer;
  display:none}
.qidiruv.bor .toza{display:block}

/* ---------- FILTR ---------- */
.filtr{display:flex;gap:7px;padding:2px 18px 14px;overflow-x:auto;
  scrollbar-width:none;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--fon) 76%,transparent)}
.filtr::-webkit-scrollbar{display:none}
.tug{flex:0 0 auto;padding:8px 13px;border-radius:999px;font-size:12.5px;
  font-weight:600;background:var(--qatlam);color:var(--xira);
  border:1px solid var(--chiziq);cursor:pointer;transition:.16s;
  display:flex;align-items:center;gap:6px}
.tug i{font-style:normal;font-size:10.5px;opacity:.6}
.tug.faol{background:var(--matn);color:#0b0d10;border-color:var(--matn)}
.tug.faol i{opacity:.5}

/* ---------- TO'R ---------- */
.tor{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 18px}
.karta{position:relative;border-radius:var(--r);overflow:hidden;
  background:var(--qatlam);border:1px solid var(--chiziq);cursor:pointer;
  aspect-ratio:4/5;transition:transform .16s,border-color .16s}
.karta:active{transform:scale(.972)}
.karta img{width:100%;height:100%;object-fit:cover}
.karta .nom{position:absolute;left:0;right:0;bottom:0;padding:26px 11px 10px;
  font-size:12.5px;font-weight:600;line-height:1.25;
  background:linear-gradient(transparent,rgba(6,8,11,.9))}
.karta.och .nom{background:linear-gradient(transparent,rgba(255,255,255,.94));
  color:#0f1115}
.nishon{position:absolute;top:8px;left:8px;font-size:9px;font-weight:700;
  letter-spacing:.7px;padding:4px 8px;border-radius:999px;
  background:rgba(255,85,0,.92);color:#fff;text-transform:uppercase}
.kadr-son{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:700;
  padding:4px 7px;border-radius:999px;background:rgba(8,10,13,.62);
  backdrop-filter:blur(6px);color:#fff}
.karta.och .kadr-son{background:rgba(255,255,255,.75);color:#0f1115}
.yuk{padding:56px 20px;text-align:center;color:var(--xira);font-size:14px;
  grid-column:1/-1}
.skelet{aspect-ratio:4/5;border-radius:var(--r);background:var(--qatlam);
  animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}

/* ---------- OYNA ---------- */
.varaq{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;
  background:var(--fon)}
.varaq.ochiq{display:flex}
.varaq-bosh{display:flex;align-items:flex-start;justify-content:space-between;
  padding:16px 18px 10px;gap:12px;flex:0 0 auto}
.varaq-bosh h2{margin:0;font-family:var(--sarlavha);font-size:20px;
  font-weight:700;letter-spacing:-.4px;line-height:1.2}
.varaq-bosh .kichik{font-size:10.5px;color:var(--xira);letter-spacing:1.8px;
  text-transform:uppercase;margin-top:5px}
.yop{width:33px;height:33px;border-radius:50%;background:var(--qatlam);
  border:1px solid var(--chiziq);display:flex;align-items:center;
  justify-content:center;font-size:17px;cursor:pointer;flex:0 0 auto;
  color:var(--matn)}
.varaq-ich{flex:1;overflow-y:auto;padding:0 18px 26px}

/* ---------- ISH OYNASI ---------- */
.tasma{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;background:#08090c;flex:0 0 auto}
.tasma::-webkit-scrollbar{display:none}
.tasma img{flex:0 0 100%;scroll-snap-align:center;width:100%;
  height:52vh;object-fit:contain}
.nuqta{display:flex;gap:5px;justify-content:center;padding:11px 0 4px}
.nuqta i{width:5px;height:5px;border-radius:50%;background:#2b3039;
  transition:.2s}
.nuqta i.faol{background:var(--urgu);width:16px;border-radius:3px}
.uslub{font-size:13.5px;line-height:1.62;color:#b4bcc8;padding:10px 0 4px}
.uslub b{color:var(--ikki);font-weight:700;display:block;font-size:10px;
  letter-spacing:2.2px;text-transform:uppercase;margin-bottom:7px}
.amallar{display:flex;gap:8px;padding:14px 0 6px}
.amal{flex:1;padding:11px 6px;border-radius:12px;background:var(--qatlam);
  border:1px solid var(--chiziq);color:var(--matn);font-size:13px;
  font-weight:600;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:6px;transition:.15s}
.amal:active{transform:scale(.96)}
.amal.bosilgan{background:rgba(255,85,0,.14);border-color:var(--urgu);
  color:var(--urgu)}
.shunday{width:100%;margin-top:10px;padding:14px;border-radius:13px;
  background:var(--urgu);color:#fff;border:0;font-weight:700;font-size:14.5px;
  cursor:pointer}
.shunday:active{background:var(--urgu-toq)}
.uchqun{position:fixed;pointer-events:none;font-size:24px;
  animation:uch .85s ease-out forwards;z-index:200}
@keyframes uch{0%{opacity:1;transform:translateY(0) scale(.6)}
  100%{opacity:0;transform:translateY(-80px) scale(1.4)}}

/* ---------- NARXLAR ---------- */
.tarif{border:1px solid var(--chiziq);border-radius:var(--r-katta);
  padding:19px;margin-bottom:12px;background:var(--qatlam);position:relative;
  overflow:hidden}
.tarif.tavsiya{border-color:var(--urgu)}
.tarif.tavsiya::before{content:"KO'P TANLANADI";position:absolute;top:15px;
  right:0;background:var(--urgu);color:#fff;font-size:8.5px;font-weight:800;
  letter-spacing:1.2px;padding:5px 11px 5px 9px;border-radius:8px 0 0 8px}
.tarif h3{margin:0;font-family:var(--sarlavha);font-size:15.5px;
  font-weight:700;letter-spacing:-.2px}
.tarif .kim{margin:6px 0 0;font-size:12px;color:var(--xira)}
.tarif .baho{margin:14px 0 2px;font-family:var(--sarlavha);font-size:25px;
  font-weight:700;color:var(--urgu);letter-spacing:-.8px}
.tarif .som{font-size:13px;font-weight:600;color:var(--xira);margin-left:5px;
  font-family:var(--matn-shrift);letter-spacing:0}
.tarif .kun{font-size:11px;color:var(--xira);letter-spacing:1.4px;
  text-transform:uppercase;margin-bottom:14px}
.tarif ul{list-style:none;margin:0 0 16px;padding:0}
.tarif li{font-size:13.5px;line-height:1.5;color:#c3cad4;padding-left:18px;
  position:relative;margin-bottom:7px}
.tarif li::before{content:"";position:absolute;left:0;top:8px;width:8px;
  height:2px;background:var(--urgu);border-radius:2px}
.tarif .ol{width:100%;padding:13px;border-radius:12px;
  border:1px solid var(--chiziq);background:#1a1f27;color:var(--matn);
  font-weight:700;font-size:14px;cursor:pointer}
.tarif.tavsiya .ol{background:var(--urgu);border-color:var(--urgu);color:#fff}
.shart{border:1px dashed var(--chiziq);border-radius:15px;padding:15px 17px;
  font-size:12.8px;line-height:1.6;color:#a2aab6}
.shart b{color:var(--ikki);display:block;font-size:9.5px;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:7px;font-weight:800}

/* ---------- JARAYON ---------- */
.qadam{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid
  var(--chiziq)}
.qadam:last-child{border-bottom:0}
.qadam .raq{flex:0 0 auto;width:34px;height:34px;border-radius:11px;
  background:var(--qatlam);border:1px solid var(--chiziq);display:flex;
  align-items:center;justify-content:center;font-family:var(--sarlavha);
  font-size:13px;font-weight:700;color:var(--urgu)}
.qadam h4{margin:0 0 4px;font-size:15px;font-weight:700}
.qadam .vaqt{font-size:10.5px;color:var(--ikki);letter-spacing:1.6px;
  text-transform:uppercase;margin-bottom:6px}
.qadam p{margin:0;font-size:13.5px;line-height:1.55;color:#aab2be}

/* ---------- PASTKI PANEL ---------- */
.panel{position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:11px 18px calc(11px + env(safe-area-inset-bottom));
  background:rgba(11,13,17,.93);backdrop-filter:blur(16px);
  border-top:1px solid var(--chiziq);display:flex;gap:8px;align-items:center}
.asosiy{flex:1;padding:14px;border-radius:13px;background:var(--urgu);
  color:#fff;font-weight:700;font-size:14.5px;text-align:center;border:0;
  cursor:pointer}
.asosiy:active{background:var(--urgu-toq)}
.ikon{width:50px;height:48px;border-radius:13px;background:var(--qatlam);
  border:1px solid var(--chiziq);color:var(--matn);font-size:11px;
  font-weight:600;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;line-height:1}
.ikon span{font-size:15px}

</style>
</head>
<body>

<div class="bosh">
  <div class="mark"><span class="nom">malades.bola</span><i class="nuqta"></i></div>
  <div class="kasb">brend va sport identikasi</div>
  <div class="shior">Shunchaki chiroyli emas, <b>sababi bilan.</b></div>
  <div class="raqamlar">
    <div class="raqam"><b id="s-brend">—</b><span>brend</span></div>
    <div class="raqam"><b id="s-logo">—</b><span>ish</span></div>
    <div class="raqam"><b id="s-klub">—</b><span>klub gerbi</span></div>
  </div>
</div>

<div class="ishonch">
  <div class="sarl">Ishonch bildirganlar</div>
  <div class="qator"><b>O'zbekiston futzal assotsiatsiyasi</b><b>Andijon FK</b><b>AZUR Samarqand</b><b>Sherdor</b><b>SonicX</b><b>PDP School</b><b>echipta</b><b>Tovarim.uz</b></div>
</div>

<div class="qidiruv" id="q-quti">
  <span class="belgi">⌕</span>
  <input id="qidir" type="search" placeholder="Brend nomi bo'yicha qidirish"
         autocomplete="off">
  <span class="toza" id="q-toza">×</span>
</div>

<div class="filtr" id="filtr"></div>
<div class="tor" id="tor"></div>

<!-- ISH OYNASI -->
<div class="varaq" id="oyna">
  <div class="varaq-bosh">
    <div>
      <h2 id="o-nom"></h2>
      <div class="kichik" id="o-var"></div>
    </div>
    <div class="yop" id="o-yop">✕</div>
  </div>
  <div class="tasma" id="o-tasma"></div>
  <div class="nuqta" id="o-nuqta"></div>
  <div class="varaq-ich">
    <div class="uslub" id="o-uslub"></div>
    <div class="amallar">
      <button class="amal" id="o-olov">🔥 <span id="n-olov"></span></button>
      <button class="amal" id="o-like">★ <span id="n-like"></span></button>
      <button class="amal" id="o-saqla">⤓ Saqlash</button>
    </div>
    <button class="shunday" id="o-shunday">Shunga o'xshash kerak</button>
  </div>
</div>

<!-- NARXLAR -->
<div class="varaq" id="narx-oyna">
  <div class="varaq-bosh">
    <div><h2>Xizmat va narxlar</h2><div class="kichik">2026</div></div>
    <div class="yop" id="narx-yop">✕</div>
  </div>
  <div class="varaq-ich" id="narx-ich"></div>
</div>

<!-- JARAYON -->
<div class="varaq" id="jarayon-oyna">
  <div class="varaq-bosh">
    <div><h2>Ish jarayoni</h2><div class="kichik">besh bosqich</div></div>
    <div class="yop" id="jarayon-yop">✕</div>
  </div>
  <div class="varaq-ich" id="jarayon-ich"></div>
</div>

<div class="panel">
  <button class="asosiy" id="buyurtma">Buyurtma berish</button>
  <button class="ikon" id="narx"><span>₸</span>narx</button>
  <button class="ikon" id="jarayon"><span>⇄</span>jarayon</button>
</div>

<script>
var TG = window.Telegram ? window.Telegram.WebApp : null;
if (TG) {
  TG.ready(); TG.expand();
  try { TG.setHeaderColor("#0F1115"); TG.setBackgroundColor("#0F1115"); }
  catch (e) {}
}
function titra(t){ try{ TG.HapticFeedback.impactOccurred(t||"light"); }catch(e){} }

var malumot = {}, uslublar = {}, joriy = "hammasi", ochiq = null, izlash = "";
var reaksiya = {};
try { reaksiya = JSON.parse(localStorage.getItem("mb_reaksiya") || "{}"); }
catch (e) { reaksiya = {}; }
function reaksiyaYoz(){
  try { localStorage.setItem("mb_reaksiya", JSON.stringify(reaksiya)); }
  catch (e) {}
}
function r(nom){
  if (!reaksiya[nom]) reaksiya[nom] = {olov:0, like:0};
  return reaksiya[nom];
}

var TOIFA = [
  ["hammasi","Hammasi"], ["buyurtma","Buyurtma"], ["sport","Sport"],
  ["biznes","Biznes"], ["talim","Ta'lim"], ["ovqat","Ovqat"],
  ["texno","Texno"], ["sanoat","Sanoat"], ["konsept","Konsept"]
];

function toifasi(v){ return v.toifa || (v.klub ? "sport" : "biznes"); }

function mos(nom, v){
  if (izlash && nom.toLowerCase().indexOf(izlash) < 0) return false;
  if (joriy === "hammasi") return true;
  if (joriy === "buyurtma") return v.haqiqiy === 1;
  if (joriy === "konsept") return v.haqiqiy === 0;
  return toifasi(v) === joriy;
}

function soni(kalit){
  var n = 0;
  for (var nom in malumot) {
    var v = malumot[nom];
    if (izlash && nom.toLowerCase().indexOf(izlash) < 0) continue;
    if (kalit === "hammasi") { n++; continue; }
    if (kalit === "buyurtma") { if (v.haqiqiy === 1) n++; continue; }
    if (kalit === "konsept") { if (v.haqiqiy === 0) n++; continue; }
    if (toifasi(v) === kalit) n++;
  }
  return n;
}

function filtrChiz(){
  var f = document.getElementById("filtr");
  f.innerHTML = "";
  TOIFA.forEach(function(t){
    var n = soni(t[0]);
    if (!n && t[0] !== joriy) return;
    var b = document.createElement("button");
    b.className = "tug" + (t[0] === joriy ? " faol" : "");
    b.innerHTML = t[1] + "<i>" + n + "</i>";
    b.onclick = function(){ joriy = t[0]; titra(); filtrChiz(); torChiz(); };
    f.appendChild(b);
  });
}

function torChiz(){
  var tor = document.getElementById("tor");
  tor.innerHTML = "";
  var nomlar = Object.keys(malumot).sort(function(a, b){
    var x = malumot[a], y = malumot[b];
    var xa = x.tanlangan ? 0 : (x.haqiqiy === 1 ? 1 : 2);
    var ya = y.tanlangan ? 0 : (y.haqiqiy === 1 ? 1 : 2);
    if (xa !== ya) return xa - ya;
    return a.localeCompare(b);
  });
  var bor = 0;
  nomlar.forEach(function(nom){
    var v = malumot[nom];
    if (!mos(nom, v)) return;
    bor++;
    var k = document.createElement("div");
    k.className = "karta" + (v.tema !== "qora" ? " och" : "");
    var birinchi = v.kadrlar.length ? v.kadrlar[0].fayl : "";
    var belgi = "";
    if (v.haqiqiy === 1) belgi = '<div class="nishon">buyurtma</div>';
    var son = v.kadrlar.length > 1
      ? '<div class="kadr-son">' + v.kadrlar.length + '</div>' : "";
    k.innerHTML = '<img loading="lazy" src="rasm/' + v.papka + '/' +
      birinchi + '" alt="' + nom + '">' + belgi + son +
      '<div class="nom">' + nom + '</div>';
    k.onclick = function(){ ochish(nom, v); };
    tor.appendChild(k);
  });
  if (!bor) tor.innerHTML = '<div class="yuk">Topilmadi</div>';
}

/* ---------- ISH OYNASI ---------- */
function ochish(nom, v){
  ochiq = {nom: nom, v: v};
  titra();
  document.getElementById("o-nom").textContent = nom;
  var tasma = document.getElementById("o-tasma");
  var nuqta = document.getElementById("o-nuqta");
  tasma.innerHTML = ""; nuqta.innerHTML = "";
  v.kadrlar.forEach(function(k, i){
    var im = document.createElement("img");
    im.src = "rasm/" + v.papka + "/" + k.fayl;
    im.loading = i ? "lazy" : "eager";
    tasma.appendChild(im);
    var d = document.createElement("i");
    if (!i) d.className = "faol";
    nuqta.appendChild(d);
  });
  document.getElementById("o-var").textContent =
    v.kadrlar.length ? v.kadrlar[0].variant : "";
  tasma.scrollLeft = 0;
  tasma.onscroll = function(){
    var i = Math.round(tasma.scrollLeft / tasma.clientWidth);
    var d = nuqta.children;
    for (var j = 0; j < d.length; j++) d[j].className = (j === i ? "faol" : "");
    if (v.kadrlar[i])
      document.getElementById("o-var").textContent = v.kadrlar[i].variant;
  };

  var u = uslublar[nom];
  document.getElementById("o-uslub").innerHTML =
    u ? "<b>Uslub haqida</b>" + u : "";

  var x = r(nom);
  yangilaAmal(x);
  varaqOch("oyna");
}

function yangilaAmal(x){
  document.getElementById("n-olov").textContent = x.olov || "";
  document.getElementById("n-like").textContent = x.like || "";
  document.getElementById("o-olov").className = "amal" + (x.olov ? " bosilgan" : "");
  document.getElementById("o-like").className = "amal" + (x.like ? " bosilgan" : "");
}

function uchqun(tugma, belgi){
  var q = document.createElement("div");
  q.className = "uchqun"; q.textContent = belgi;
  var b = tugma.getBoundingClientRect();
  q.style.left = (b.left + b.width / 2 - 12) + "px";
  q.style.top = (b.top - 6) + "px";
