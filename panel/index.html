<!doctype html>
<html lang="uz">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Andijon PFK — jonli panel</title>
<style>
 html,body{height:100%;margin:0;background:#0b1020;color:#e8ecf7;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;text-align:center}
 .q{padding:28px;max-width:420px}
 .n{font-size:19px;font-weight:600;margin-bottom:10px}
 .k{opacity:.65;font-size:14px}
 a{color:#8ab4ff}
 .h{display:inline-block;width:26px;height:26px;margin-bottom:18px;
  border:3px solid rgba(255,255,255,.18);border-top-color:#8ab4ff;
  border-radius:50%;animation:s .8s linear infinite}
 @keyframes s{to{transform:rotate(360deg)}}
 .y{display:none;margin-top:16px;padding:11px 18px;background:#1b2440;
  border-radius:10px;text-decoration:none;color:#8ab4ff}
</style>
<div class="q">
  <div class="h" id="h"></div>
  <div class="n" id="n">Andijon PFK — jonli panel</div>
  <div class="k" id="k">ochilmoqda…</div>
  <a class="y" id="y" href="#">Qo'lda ochish</a>
</div>
<script>
(function(){
  var ICHKI = "https://1741a1ab3ad0ce.lhr.life";
  var VAQT  = "2026-08-26 15:01:05";
  // SO'ROV QATORI HAM UZATILADI.
  // Bosma dasturnomadagi QR `/dastur/?mid=2` ko'rinishida bo'ladi —
  // aynan SHU o'yin. Uzatilmasa har QR eng yaqin o'yinni ochardi va
  // eski dasturnomadagi QR keyingi o'yinni ko'rsatib qo'yardi.
  function ket(u){
    if(!u){ yopiq(); return; }
    var s = location.search || "";
    if(s.length > 1){ u += (u.indexOf("?") < 0 ? "?" : "&") + s.slice(1); }
    if(location.hash){ u += location.hash; }
    document.getElementById("y").href = u;
    document.getElementById("y").style.display = "inline-block";
    location.replace(u);
  }
  function yopiq(){
    document.getElementById("h").style.display = "none";
    document.getElementById("k").innerHTML =
      "Panel hozir yopiq.<br><span style='opacity:.6'>Kompyuter " +
      "o'chirilgan yoki tunnel uzilgan. Biroz keyin urinib ko'ring.</span>";
  }
  // Yangi manzilni yonidagi fayldan tekshiramiz (kesh eskirgan bo'lsa).
  var x = new XMLHttpRequest();
  x.open("GET", "manzil.json?v=" + Date.now(), true);
  x.timeout = 4000;
  x.onload = function(){
    try{
      var d = JSON.parse(x.responseText);
      ket(d && d.url ? d.url : ICHKI);
    }catch(e){ ket(ICHKI); }
  };
  x.onerror = x.ontimeout = function(){ ket(ICHKI); };
  x.send();
})();
</script>
