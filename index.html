<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dasturnoma — FK Andijon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ------------------------------------------------------------------
   BRENDBUK: KOK #021B53 · QIZIL #EB1F28 · OLTIN #E2BA75 · TUN #03102E
   Boshqa rang ishlatilmaydi.

   TUZILISH. Ma'lumot juda ko'p — hammasi ochiq tursa sahifa cheksiz
   uzayadi va muxlis pastgacha yetib bormaydi. Shuning uchun har
   bo'lim YIG'ILGAN holda chiqadi: sarlavhada eng muhim raqam
   ko'rinadi, bosilganda ichi ochiladi.
   ------------------------------------------------------------------ */
:root{
  --kok:#021B53; --qizil:#EB1F28; --oltin:#E2BA75; --tun:#03102E;
  --oq:#fff; --matn2:rgba(255,255,255,.60); --matn3:rgba(255,255,255,.30);
  --chiziq:rgba(255,255,255,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* Sahifa uzun bo'lgani uchun html ga ham tus beramiz: `body` fon
   rasmi `fixed` — pastga scroll qilganda ostida oq zolg'a chiqmasin. */
html{background:var(--tun)}
body{
  background:
    radial-gradient(90% 50% at 50% -8%, rgba(235,31,40,.18) 0%, rgba(3,16,46,0) 60%),
    linear-gradient(180deg,#062266 0%,#04184a 30%,#03102E 100%);
  background-attachment:fixed;
  color:var(--oq);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;padding-bottom:46px;min-height:100vh}
body.u21{
  background:
    radial-gradient(90% 50% at 50% -8%, rgba(226,186,117,.16) 0%, rgba(2,12,36,0) 60%),
    linear-gradient(180deg,#04184A 0%,#02123A 40%,#020C24 100%);
  background-attachment:fixed}
.tasma{height:5px;background:linear-gradient(90deg,var(--qizil) 0 34%,var(--oltin) 34% 52%,#1746b8 52% 100%)}
body.u21 .tasma{background:var(--oltin)}

/* ---------- sarlavha ---------- */
.bosh{padding:18px 16px 12px;text-align:center}
.turnir{font-size:11.5px;letter-spacing:3px;color:var(--oltin);text-transform:uppercase}
.rozet{display:inline-block;background:var(--qizil);color:#fff;font-weight:800;
  font-size:11.5px;letter-spacing:2px;padding:3px 9px;border-radius:7px;margin-left:6px;
  vertical-align:middle}
.juft{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}
.jt{flex:1;text-align:center;min-width:0}
.gerb{width:58px;height:58px;object-fit:contain;display:block;margin:0 auto 7px}
.gerb.yoq{display:none}
.jnom{font-weight:700;font-size:14.5px;line-height:1.2;word-break:break-word}
.jorin{font-size:11.5px;color:var(--matn2);margin-top:3px}
.orta{flex:none;text-align:center;min-width:78px}
.vaqt{font-size:25px;font-weight:800;letter-spacing:1px}
.sana{font-size:11.5px;color:var(--matn2);margin-top:2px}
.qator{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:13px}
.teg{background:rgba(255,255,255,.07);border:1px solid var(--chiziq);
  border-radius:9px;padding:5px 10px;font-size:12px}
.teg b{color:var(--oltin);font-weight:600}

/* ---------- yig'iladigan bo'lim ---------- */
.bolim{margin:11px 11px;background:rgba(255,255,255,.045);
  border:1px solid var(--chiziq);border-radius:15px;overflow:hidden}
.bolim>summary{list-style:none;cursor:pointer;padding:13px 15px;
  display:flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:2px;
  text-transform:uppercase;color:var(--oltin);font-weight:700}
.bolim>summary::-webkit-details-marker{display:none}
.bolim>summary .ozod{margin-left:auto;font-size:11.5px;letter-spacing:0;
  text-transform:none;color:var(--matn2);font-weight:400;text-align:right}
.bolim>summary:after{content:"▾";margin-left:8px;color:var(--matn3);
  transition:transform .15s;font-size:14px}
.bolim[open]>summary:after{transform:rotate(180deg)}
.ich{padding:0 15px 14px}

.qat{display:flex;align-items:center;gap:10px;padding:7px 0;
  border-top:1px solid rgba(255,255,255,.055);font-size:14px}
.qat:first-child{border-top:none}
.num{width:26px;flex:none;text-align:right;color:var(--oltin);font-weight:700;font-size:13px}
.ism{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qiy{flex:none;color:var(--matn2);font-size:12px;text-align:right}
.kichik{font-size:11.5px;color:var(--matn2)}
.sarl{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--matn3);margin:12px 0 3px}
.sarl:first-child{margin-top:2px}

/* ---------- jadval ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10px;letter-spacing:1px;color:var(--matn3);text-transform:uppercase;
  padding:5px 3px;text-align:center;font-weight:600}
th.chap,td.chap{text-align:left}
td{padding:6px 3px;text-align:center;border-top:1px solid rgba(255,255,255,.055)}
tr.biz td{background:rgba(235,31,40,.16);font-weight:700}
tr.raqib td{background:rgba(226,186,117,.13)}
td.klub{display:flex;align-items:center;gap:7px;text-align:left}
td.klub img{width:17px;height:17px;object-fit:contain;flex:none}

/* ---------- shakl ---------- */
.shakl{display:flex;gap:6px;flex-wrap:wrap}
.sh{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11.5px;font-weight:800;flex:none}
.sh.g{background:#1f9d55}.sh.d{background:#7a7f8c}.sh.m{background:var(--qizil)}

/* ---------- voqealar lentasi ---------- */
.vq{display:flex;gap:9px;padding:6px 0;border-top:1px solid rgba(255,255,255,.055);
  font-size:13.5px;align-items:flex-start}
.vq:first-child{border-top:none}
.vq .dq{width:38px;flex:none;color:var(--oltin);font-weight:700;font-size:12.5px;
  text-align:right}
.vq .bl{width:20px;flex:none;text-align:center}
.vq.ular{opacity:.72}
.vq .qo{color:var(--matn2);font-size:12px}

/* ---------- taqqoslash chizig'i ---------- */
.tq{margin:9px 0}
.tq .yorliq{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.tq .yorliq span{color:var(--matn2)}
.tq .yorliq b{font-weight:700}
.tq .chiz{height:6px;border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden;display:flex}
.tq .chiz i{display:block;height:100%}
.tq .chiz i.a{background:var(--qizil)}
.tq .chiz i.b{background:var(--oltin)}

/* ---------- xato / yuklanish ---------- */
.xato{margin:40px 18px;text-align:center;color:var(--matn2);font-size:14px}
.xato b{display:block;color:var(--oq);font-size:16px;margin-bottom:7px}
.tugma{display:inline-block;margin-top:14px;background:var(--qizil);color:#fff;
  text-decoration:none;font-weight:700;padding:11px 20px;border-radius:11px;font-size:14px}
.oyoq{text-align:center;color:var(--matn3);font-size:11px;margin-top:22px;
  padding:0 18px}
.yuk{text-align:center;padding:60px 0;color:var(--matn2)}
/* ---------- HOMIYLAR ----------
   Operator qat'iy talabi (2026-08-21): «homiyni hammasiga
   qo'shamiz, indexlarga ham». Ilova ham «joy»: muxlis u yerda
   bir necha daqiqa turadi. Lenta faqat PASTDA — postlardagi
   qoida bilan bir xil. Rasm posterlardagi bitta fayl
   (`assets/Sponsor/sponsors.png`), `/mvp/homiy` orqali. */
.homiy{margin:26px 14px 18px;padding-top:18px;text-align:center;
  border-top:1px solid rgba(255,255,255,.09)}
.homiy .sarl{font-size:10px;letter-spacing:2.6px;
  color:var(--matn3);text-transform:uppercase;font-weight:700;
  margin-bottom:12px}
.homiy img{max-width:100%;width:min(330px,84%);height:auto;
  opacity:.92;display:block;margin:0 auto}
</style>
</head>
<body>
<div class="tasma"></div>
<div id="ekran"><div class="yuk">Yuklanmoqda…</div></div>
<div class="homiy">
  <div class="sarl">Homiylar</div>
  <img src="/mvp/homiy" alt="Homiylar"
       onerror="this.parentNode.style.display='none'">
</div>
<script>
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if(TG){ TG.ready(); TG.expand(); }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
/* Gerb. `o` — piksel o'lchami: server shu o'lchamdagi kichik nusxani
   qaytaradi. Asl fayllar 150-700 KB, jadvalda 16 tasi bir varaqda —
   kichraytirmasak sahifa telefon internetida ochilmaydi. */
function gerb(nom, o){
  var n = String(nom||"");
  var g = window.GERBLAR || {};
  if(g[n]) return g[n];
  n = n.replace(/ (U21|U19|U18|FA)$/, "");
  return g[n] || "";
}
function bor(x){
  if(!x) return false;
  if(Array.isArray(x)) return x.length>0;
  if(typeof x === "object") return Object.keys(x).length>0;
  return true;
}
/* Bo'lim: sarlavha + o'ng tomonda qisqa xulosa + yig'ilgan ichki qism */
function bolim(sarlavha, xulosa, ich, ochiq){
  if(!ich) return "";
  return '<details class="bolim"'+(ochiq?" open":"")+'><summary>'+
    esc(sarlavha)+(xulosa? '<span class="ozod">'+esc(xulosa)+'</span>':"")+
    '</summary><div class="ich">'+ich+'</div></details>';
}
function qat(chap, ong, num){
  return '<div class="qat">'+(num!=null&&num!==""? '<div class="num">'+esc(num)+'</div>':"")+
    '<div class="ism">'+chap+'</div>'+(ong? '<div class="qiy">'+ong+'</div>':"")+'</div>';
}
function shakl(lst){
  if(!bor(lst)) return "";
  return '<div class="shakl">'+lst.map(x=>'<div class="sh '+esc(x.natija)+
    '" title="'+esc(x.raqib+" "+x.hisob)+'">'+
    (x.natija==="g"?"G":x.natija==="m"?"M":"D")+'</div>').join("")+'</div>';
}
/* Ikki jamoani yonma-yon taqqoslaydigan chiziq */
function taqqos(nom, a, b){
  a = +a||0; b = +b||0;
  const j = a+b || 1;
  return '<div class="tq"><div class="yorliq"><b>'+esc(a)+'</b><span>'+
    esc(nom)+'</span><b>'+esc(b)+'</b></div><div class="chiz">'+
    '<i class="a" style="width:'+(100*a/j)+'%"></i>'+
    '<i class="b" style="width:'+(100*b/j)+'%"></i></div></div>';
}

/* ================= SARLAVHA ================= */
function sarlavha(d){
  const o = d.oyin, sb = d.stat_biz||{}, sr = d.stat_raqib||{};
  const uy_biz = o.uyda;
  const orin = k => k && k.orin ? k.orin+"-o'rin · "+k.ochko+" ochko" : "";
  const jt = (nom, st) =>
    '<div class="jt"><img class="gerb" src="'+gerb(nom)+
    '" onerror="this.classList.add(\'yoq\')"><div class="jnom">'+esc(nom)+
    '</div>'+(orin(st)? '<div class="jorin">'+esc(orin(st))+'</div>':"")+'</div>';
  let h = '<div class="bosh">';
  h += '<div class="turnir">'+esc(o.turnir)+(o.tur? " · "+esc(o.tur):"")+
       (d.yosh? '<span class="rozet">U21</span>':"")+'</div>';
  h += '<div class="juft">';
  h += jt(o.uy, uy_biz? sb : sr);
  h += '<div class="orta"><div class="vaqt">'+esc(o.hisob||o.soat||"—")+
       '</div><div class="sana">'+esc(o.sana)+'</div>'+
       (o.kun? '<div class="sana">'+esc(o.kun)+'</div>':"")+'</div>';
  h += jt(o.mehmon, uy_biz? sr : sb);
  h += '</div>';
  const teg = [];
  if(o.stadion) teg.push(["Stadion", o.stadion]);
  if(o.tv) teg.push(["Translatsiya", o.tv]);
  if(o.sharhlovchi) teg.push(["Sharhlovchi", o.sharhlovchi]);
  if(o.forma) teg.push(["Formamiz", o.forma]);
  if(o.chipta) teg.push(["Chipta", o.chipta]);
  if(teg.length){
    h += '<div class="qator">'+teg.map(t=>'<div class="teg">'+esc(t[0])+
      ': <b>'+esc(t[1])+'</b></div>').join("")+'</div>';
  }
  h += '</div>';
  return h;
}

/* ================= BO'LIMLAR ================= */
function b_holat(d){
  /* TARTIB — MEZBON CHAPDA.
     Ilgari bu bo'limda BIZ har doim chapda turardik, sarlavhada
     esa mezbon chapda edi. Safar o'yinida ikkisi teskari tushib,
     raqam qaysi jamoaniki ekani chalkashib ketardi. Endi hamma
     joyda bitta tartib: uy egasi chapda, mehmon o'ngda. */
  const uyda = !!d.oyin.uyda;
  const a = uyda? (d.stat_biz||{}) : (d.stat_raqib||{});
  const b = uyda? (d.stat_raqib||{}) : (d.stat_biz||{});
  if(!bor(a) && !bor(b)) return "";
  const A = d.oyin.uy, B = d.oyin.mehmon;
  let h = '<div class="kichik" style="margin-bottom:8px">'+
    esc(A)+' <span style="color:var(--qizil)">■</span> · '+
    esc(B)+' <span style="color:var(--oltin)">■</span></div>';
  h += taqqos("Ochko", a.ochko, b.ochko);
  h += taqqos("G'alaba", a.g, b.g);
  h += taqqos("Urgan gol", a.urgan, b.urgan);
  h += taqqos("Yegan gol", a.yegan, b.yegan);
  const sat = (nom, x) => x ? '<div class="qat"><div class="ism">'+esc(nom)+
    '</div><div class="qiy">'+x.oyin+' o\'yin · '+x.g+'-'+x.d+'-'+x.m+
    ' · '+x.urgan+':'+x.yegan+'</div></div>' : "";
  h += '<div class="sarl">'+esc(A)+'</div>';
  h += sat("Uy o'yinlari", a.uy) + sat("Safar o'yinlari", a.safar);
  h += '<div class="sarl">'+esc(B)+'</div>';
  h += sat("Uy o'yinlari", b.uy) + sat("Safar o'yinlari", b.safar);
  const uyst = uyda? a.uy : b.uy;
  if(uyst && uyst.tomoshabin)
    h += '<div class="qat"><div class="ism">O\'rtacha tomoshabin ('+
         esc(A)+', uyda)</div><div class="qiy">'+
         esc(uyst.tomoshabin)+'</div></div>';
  return h;
}

function b_tarkib(d){
  /* Ikki holat bor va ular boshqa-boshqa narsa:
       manba="tarkib"   — e'lon qilingan HAQIQIY tarkib;
       manba="qaydnoma" — so'nggi 3 o'yin qaydnomasidan olingan
                          ehtimoliy o'n bir kishi.
     Ikkinchisini «boshlang'ich tarkib» deb ko'rsatish — muxlisni
     chalg'itish. Shuning uchun sarlavha ham, izoh ham boshqacha. */
  const t = d.tarkib||{};
  if(!bor(t)) return "";
  const qayd = t.manba === "qaydnoma";
  let h = "";
  if(qayd && t.izoh)
    h += '<div class="kichik" style="margin-bottom:8px">'+esc(t.izoh)+
         ' — tarkib e\'lon qilinganda yangilanadi.</div>';
  const yon = (nom, x) => {
    if(!x || !bor(x.asosiy)) return "";
    let s = '<div class="sarl">'+esc(nom)+(qayd? " — oxirgi 3 o'yinda"
                                          : " — boshlang'ich")+'</div>';
    s += x.asosiy.map(p=>qat(esc(p.ism),
      (qayd && p.oyin)? p.oyin+"/"+(x.oyin_soni||3):"",
      p.raqam||"")).join("");
    if(bor(x.zaxira)){
      s += '<div class="sarl">'+(qayd? "Boshqalar":"Zaxira")+'</div>';
      s += '<div class="kichik">'+x.zaxira.map(p=>
        (p.raqam? p.raqam+". ":"")+esc(p.ism)).join(" · ")+'</div>';
    }
    return s;
  };
  /* MEZBON CHAPDA — sarlavha bilan bir xil tartib. */
  const biz = yon(d.oyin.biz, t.biz), raq = yon(d.oyin.raqib, t.raqib);
  return d.oyin.uyda? (biz + raq) : (raq + biz);
}

function b_oxirgi(d){
  const u = d.oxirgi_uchrashuv||{};
  if(!bor(u)) return "";
  let h = '<div class="qat"><div class="ism"><b>'+esc(u.uy)+' '+esc(u.hisob)+
    ' '+esc(u.mehmon)+'</b></div></div>';
  h += '<div class="kichik">'+esc(u.sana)+(u.turnir? " · "+esc(u.turnir):"")+
    (u.tur? " · "+esc(u.tur):"")+(u.stadion? " · "+esc(u.stadion):"")+
    (u.tomoshabin? " · "+esc(u.tomoshabin)+" tomoshabin":"")+'</div>';
  if(bor(u.voqea)){
    h += '<div class="sarl">O\'yin voqealari</div>';
    h += u.voqea.map(v=>{
      const biz = v.klub_id === u.uy_id;
      /* Almashtirishda `kim` MAYDONGA TUSHGAN, `kim2` CHIQQAN
         (PFL API: primaryPlayer / secondaryPlayer). Shuni ochiq
         yozamiz — o'q belgisining o'zi chalkash edi. */
      const kim = v.tur===6
        ? '⬆ '+esc(v.kim)+' <span class="qo">⬇ '+esc(v.kim2)+'</span>'
        : esc(v.kim) + (v.kim2? ' <span class="qo">(uzatma: '+
            esc(v.kim2)+')</span>' : "");
      return '<div class="vq'+(biz?"":" ular")+'"><div class="dq">'+
        esc(v.daqiqa)+"'"+'</div><div class="bl">'+v.belgi+
        '</div><div class="ism">'+kim+'</div></div>';
    }).join("");
  }
  if(u.hakam || u.murabbiy_uy){
    h += '<div class="sarl">Rasmiylar</div>';
    if(u.hakam) h += qat("Bosh hakam", esc(u.hakam));
    if(u.murabbiy_uy) h += qat("Murabbiy ("+esc(u.uy)+")", esc(u.murabbiy_uy));
    if(u.murabbiy_mehmon) h += qat("Murabbiy ("+esc(u.mehmon)+")",
                                   esc(u.murabbiy_mehmon));
  }
  if(bor(u.stat)){
    h += '<div class="sarl">O\'yin statistikasi</div>';
    h += '<div class="kichik" style="margin-bottom:6px">'+esc(u.uy)+
      ' <span style="color:var(--qizil)">■</span> · '+esc(u.mehmon)+
      ' <span style="color:var(--oltin)">■</span></div>';
    h += u.stat.map(s=>taqqos(s.nom, s.uy, s.mehmon)).join("");
  }
  if(bor(u.tarkib)){
    const yon = (nom, x) => {
      if(!x || !bor(x.asosiy)) return "";
      return '<div class="sarl">'+esc(nom)+'</div><div class="kichik">'+
        x.asosiy.map(p=>(p.raqam? p.raqam+". ":"")+esc(p.ism)).join(" · ")+
        '</div>';
    };
    h += yon(u.uy, u.tarkib.uy) + yon(u.mehmon, u.tarkib.mehmon);
  }
  return h;
}

function b_tarix(d){
  const t = d.tarix||{}, r = d.tarix_royxat||[];
  if(!bor(t) && !bor(r)) return "";
  let h = "";
  if(bor(t)){
    h += '<div class="kichik" style="margin-bottom:8px">Jami '+esc(t.oyin)+
      ' uchrashuv'+(t.boshlangan? " ("+esc(t.boshlangan)+" yildan beri)":"")+
      '</div>';
    h += taqqos("G'alaba / mag'lubiyat", t.g, t.m);
    h += '<div class="qat"><div class="ism">Durang</div><div class="qiy">'+
      esc(t.d)+'</div></div>';
    h += '<div class="qat"><div class="ism">Gollar</div><div class="qiy">'+
      esc(t.urgan)+':'+esc(t.yegan)+'</div></div>';
    if(t.quruq!=null)
      h += '<div class="qat"><div class="ism">Quruq qolgan o\'yinlar</div>'+
        '<div class="qiy">'+esc(t.quruq)+' / '+esc(t.quruq_ular)+'</div></div>';
  }
  if(bor(r)){
    h += '<div class="sarl">Oxirgi uchrashuvlar</div>';
    h += r.map(x=>'<div class="qat"><div class="num"><span class="sh '+
      esc(x.natija)+'" style="width:20px;height:20px;font-size:10px;display:inline-flex">'+
      (x.natija==="g"?"G":x.natija==="m"?"M":"D")+'</span></div>'+
      '<div class="ism">'+esc(x.sana)+' · '+(x.uyda?"uyda":"safarda")+
      (x.turnir==="U21"? " · U21":"")+'</div><div class="qiy">'+
      esc(x.hisob)+'</div></div>').join("");
  }
  return h;
}

function b_shakl(d){
  const a = d.shakl_biz||[], b = d.shakl_raqib||[];
  if(!bor(a) && !bor(b)) return "";
  const blok = (nom, lst) => {
    if(!bor(lst)) return "";
    let s = '<div class="sarl">'+esc(nom)+'</div>'+shakl(lst);
    s += lst.map(x=>'<div class="qat"><div class="ism">'+esc(x.sana)+' · '+
      (x.uyda?"":"safarda ")+esc(x.raqib)+'</div><div class="qiy">'+
      esc(x.hisob)+'</div></div>').join("");
    return s;
  };
  return blok(d.oyin.biz, a) + blok(d.oyin.raqib, b);
}

function b_jadval(d){
  const j = d.jadval||[];
  if(!bor(j)) return "";
  let h = '<table><tr><th class="chap">#</th><th class="chap">Klub</th>'+
    '<th>O</th><th>G</th><th>D</th><th>M</th><th>Gol</th><th>±</th><th>Ochko</th></tr>';
  h += j.map(r=>'<tr class="'+(r.biz?"biz":(r.raqib?"raqib":""))+'">'+
    '<td>'+esc(r.orin)+'</td><td class="klub"><img src="'+gerb(r.klub, 40)+
    '" onerror="this.style.visibility=\'hidden\'">'+esc(r.klub)+'</td>'+
    '<td>'+esc(r.oyin)+'</td><td>'+esc(r.g)+'</td><td>'+esc(r.d)+'</td>'+
    '<td>'+esc(r.m)+'</td><td>'+esc(r.urgan)+':'+esc(r.yegan)+'</td>'+
    '<td>'+(r.farq>0?"+":"")+esc(r.farq)+'</td><td><b>'+esc(r.ochko)+
    '</b></td></tr>').join("");
  return h+'</table>';
}

function b_topurar(d){
  const a = d.topurar||[], b = d.topurar_raqib||[];
  if(!bor(a) && !bor(b)) return "";
  const blok = (nom, lst) => {
    if(!bor(lst)) return "";
    return '<div class="sarl">'+esc(nom)+'</div>'+lst.map(x=>
      qat(esc(x.ism), (x.uzatma!=null? x.uzatma+" uzatma":"")+
        (x.oyin!=null? " · "+x.oyin+" o'yin":""), x.gol)).join("");
  };
  return blok(d.oyin.biz, a) + blok(d.oyin.raqib, b);
}

function b_saf(d){
  const s = d.saf||[];
  if(!bor(s)) return "";
  const GURUH = {DB:"Darvozabonlar", HIM:"Himoyachilar",
                 YH:"Yarim himoyachilar", HUJ:"Hujumchilar", "":"Boshqalar"};
  let h = "";
  ["DB","HIM","YH","HUJ",""].forEach(g=>{
    const lst = s.filter(x=>(x.guruh||"")===g);
    if(!lst.length) return;
    h += '<div class="sarl">'+GURUH[g]+'</div>';
    h += lst.map(p=>{
      const ong = [];
      if(p.oyin!=null) ong.push(p.oyin+" o'yin");
      if(p.gol) ong.push(p.gol+" gol");
      if(p.uzatma) ong.push(p.uzatma+" uzatma");
      if(!ong.length && p.qiymat) ong.push(p.qiymat);
      const past = [];
      if(p.yosh) past.push(p.yosh+" yosh");
      if(p.qiymat && ong[0]!==p.qiymat) past.push(p.qiymat);
      if(p.kontrakt) past.push("kontrakt "+String(p.kontrakt).slice(0,4));
      return qat(esc(p.ism)+(past.length? '<div class="kichik">'+
        esc(past.join(" · "))+'</div>':""), esc(ong.join(" · ")), p.raqam||"");
    }).join("");
  });
  return h;
}

function b_saf_raqib(d){
  const s = d.saf_raqib||[];
  if(!bor(s)) return "";
  return s.map(p=>qat(esc(p.ism)+(p.pozitsiya? '<div class="kichik">'+
    esc(p.pozitsiya)+'</div>':""),
    (p.oyin? p.oyin+" o'yin":"")+(p.gol? " · "+p.gol+" gol":""),
    p.raqam||"")).join("");
}

function b_intizom(d){
  const a = d.intizom||{}, b = d.intizom_raqib||{};
  if(!bor(a) && !bor(b)) return "";
  const blok = (nom, x) => {
    if(!bor(x)) return "";
    let s = '<div class="sarl">'+esc(nom)+' — jami '+esc(x.sariq)+
      ' sariq, '+esc(x.qizil)+' qizil</div>';
    s += (x.royxat||[]).map(p=>qat(esc(p.ism),
      (p.sariq? p.sariq+" 🟨":"")+(p.qizil? " "+p.qizil+" 🟥":""))).join("");
    return s;
  };
  return blok(d.oyin.biz, a) + blok(d.oyin.raqib, b);
}

function b_klublar(d){
  const A = d.klub||{}, B = d.klub_raqib||{};
  if(!bor(A) && !bor(B)) return "";
  const blok = (x) => {
    if(!bor(x)) return "";
    let s = '<div class="sarl">'+esc(x.nom||"")+'</div>';
    if(x.tashkil) s += qat("Tashkil etilgan", esc(x.tashkil));
    if(x.shahar) s += qat("Manzil", esc(x.shahar));
    if(x.stadion) s += qat("Stadion", esc(x.stadion)+
      (x.sigim? " ("+x.sigim+" o'rin)":""));
    if(x.murabbiy) s += qat("Bosh murabbiy", esc(x.murabbiy));
    if(x.qiymat) s += qat("Jamoa qiymati", esc(x.qiymat));
    if(x.urtacha_yosh) s += qat("O'rtacha yosh", esc(x.urtacha_yosh));
    return s;
  };
  return blok(A) + blok(B);
}

function b_hakamlar(d){
  const h = d.hakamlar||{};
  if(!bor(h)) return "";
  const NOM = {bosh_hakam:"Bosh hakam", yordamchi1:"Yordamchi hakam",
    yordamchi2:"Yordamchi hakam", zaxira:"Zaxira hakam", var:"VAR",
    avar:"AVAR", nazoratchi:"Hakamlar nazoratchisi", komissar:"Komissar"};
  let s = "";
  Object.keys(NOM).forEach(k=>{ if(h[k]) s += qat(NOM[k], esc(h[k])); });
  return s;
}

function b_dubl(d){
  const x = d.dubl||{};
  if(!bor(x) || !x.hisob) return "";
  return qat(esc(x.nom)+' — '+esc(x.raqib)+(x.uyda? " (uyda)":" (safarda)")+
    '<div class="kichik">'+esc(x.sana)+'</div>', '<b>'+esc(x.hisob)+'</b>');
}

function b_yoq(d){
  /* CHETDA QOLGANLAR — IKKALA JAMOADAN.
     Sharhlovchi va jurnalist eng ko'p so'raydigan savol: «kim
     o'ynay olmaydi?». Ilgari bu yerda faqat BIZNING ro'yxatimiz
     bor edi, raqibniki umuman yo'q edi. Endi raqibniki rasmiy
     qaydnomalardan hisoblanadi (qizil karta, ikkinchi sariq,
     4/8/12-sariq) va «ehtimoliy» deb belgilanadi. */
  const uy = d.oyin.uyda? (d.chetda_biz||d.yoq||[]) : (d.chetda_raqib||[]);
  const meh = d.oyin.uyda? (d.chetda_raqib||[]) : (d.chetda_biz||d.yoq||[]);
  if(!bor(uy) && !bor(meh)) return "";
  const yon = (nom, ro) => {
    if(!bor(ro)) return "";
    return '<div class="sarl">'+esc(nom)+'</div>' + ro.map(x=>
      qat(esc(x.ism), esc(x.sabab)+(x.ehtimoliy? " *":""))).join("");
  };
  let h = yon(d.oyin.uy, uy) + yon(d.oyin.mehmon, meh);
  if([].concat(uy, meh).some(x=>x.ehtimoliy))
    h += '<div class="kichik" style="margin-top:8px">* qaydnoma '+
         'bo\'yicha hisoblangan — intizomiy qo\'mita qarori bilan '+
         'o\'zgarishi mumkin.</div>';
  return h;
}

/* ================= YIG'UVCHI ================= */
function chiz(d){
  if(d.yosh) document.body.classList.add("u21");
  const o = d.oyin, sb = d.stat_biz||{}, sr = d.stat_raqib||{}, t = d.tarix||{};
  let h = sarlavha(d);
  /* O'rinlar ham mezbon-mehmon tartibida ko'rsatiladi. */
  const u_orin = o.uyda? sb.orin : sr.orin;
  const m_orin = o.uyda? sr.orin : sb.orin;
  h += bolim("Kuchlar nisbati",
             (u_orin&&m_orin)? u_orin+"-o'rin / "+m_orin+"-o'rin":"",
             b_holat(d), true);
  /* Tarkib e'lon qilinmagan bo'lsa bo'lim «Qaydnoma» deb chiqadi:
     ichida so'nggi 3 o'yinning rasmiy qaydnomasi turadi. */
  const tk = d.tarkib||{};
  h += bolim(tk.manba === "qaydnoma"? "Qaydnoma" : "Tarkiblar",
             tk.manba === "qaydnoma"? "so'nggi 3 o'yin" : "",
             b_tarkib(d), true);
  h += bolim("O'tgan uchrashuv",
             (d.oxirgi_uchrashuv||{}).hisob||"", b_oxirgi(d));
  h += bolim("O'zaro tarix",
             t.oyin? t.oyin+" o'yin · "+t.g+"-"+t.d+"-"+t.m:"", b_tarix(d));
  h += bolim("Oxirgi o'yinlar", "", b_shakl(d));
  h += bolim("Turnir jadvali", sb.orin? sb.orin+"-o'rin":"", b_jadval(d));
  h += bolim("To'purarlar", "", b_topurar(d));
  h += bolim("Jamoamiz safi", (d.saf||[]).length+" futbolchi", b_saf(d));
  h += bolim(o.raqib+" safi", (d.saf_raqib||[]).length+" futbolchi",
             b_saf_raqib(d));
  h += bolim("Kartochkalar", "", b_intizom(d));
  h += bolim("Dubl (U21) o'yini", (d.dubl||{}).hisob||"", b_dubl(d));
  /* Ikkala jamoadan chetda qolganlar — sarlavhada umumiy soni. */
  const chet = (d.chetda_biz||d.yoq||[]).length +
               (d.chetda_raqib||[]).length;
  h += bolim("O'ynay olmaydiganlar", chet||"", b_yoq(d));
  h += bolim("Uchrashuv rasmiylari", "", b_hakamlar(d));
  h += bolim("Klublar", "", b_klublar(d));
  h += '<div class="oyoq">FK Andijon matbuot xizmati · yangilandi '+
       esc(d.yangilandi||"")+'</div>';
  document.getElementById("ekran").innerHTML = h;
}

function xato(sarl, matn, havola){
  document.getElementById("ekran").innerHTML =
    '<div class="xato"><b>'+esc(sarl)+'</b>'+esc(matn)+
    (havola? '<br><a class="tugma" href="'+havola+
      '" target="_blank">Kanalga obuna bo\'lish</a>':"")+'</div>';
}

/* QAYSI O'YIN.
   Ikki yo'ldan kelishi mumkin:
     · ?mid=131        — bot ichidagi tugmadan (to'g'ridan manzil);
     · ?startapp=d131  — kanaldagi t.me havolasidan. Telegram uni
       manzilga qo'shmaydi, `start_param` ichida beradi.
   Ikkalasi ham bo'lmasa 0 — server o'zi eng yaqin o'yinni oladi. */
function oyinId(){
  const q = new URLSearchParams(location.search).get("mid");
  if(q) return parseInt(q, 10) || 0;
  let sp = "";
  try{ sp = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || ""; }
  catch(e){ sp = ""; }
  if(!sp) sp = new URLSearchParams(location.search).get("tgWebAppStartParam") || "";
  const n = String(sp).replace(/\D/g, "");
  return n ? (parseInt(n, 10) || 0) : 0;
}
