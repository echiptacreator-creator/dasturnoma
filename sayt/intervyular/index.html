<style>
@font-face{font-family:"Nekst";src:url("/shrift/Nekst-Black.ttf");
  font-weight:900;font-display:swap}
@font-face{font-family:"Nekst";src:url("/shrift/Nekst-Bold.ttf");
  font-weight:700;font-display:swap}
@font-face{font-family:"Coolvetica";src:url("/shrift/Coolvetica-Regular.otf");
  font-display:swap}
:root{--kok:#021B53;--fon:#03102E;--qizil:#EB1F28;--oltin:#E2BA75;
  --chiziq:rgba(226,186,117,.20)}
*{box-sizing:border-box}
body{margin:0;background:var(--fon);color:#fff;
  font-family:"Coolvetica",-apple-system,BlinkMacSystemFont,"Segoe UI",
  Arial,sans-serif;font-size:17px;line-height:1.6}
a{color:var(--oltin);text-decoration:none}
img{display:block;max-width:100%}
.q{max-width:1240px;margin:0 auto;padding:0 22px}

/* --- YOY NAQSHI: gerb ravog'i, brendbukning grafik elementi --- */
.yoy{position:absolute;inset:0;overflow:hidden;pointer-events:none;
  opacity:.4}
.yoy svg{position:absolute;bottom:-40%;left:50%;
  transform:translateX(-50%);height:230%;width:auto}
.yoy path{fill:none;stroke:var(--oltin);stroke-width:1.1;opacity:.2}

/* --- BOSH SAHIFA HERO: keyingi o'yin va o'rin --- */
.hero{position:relative;overflow:hidden;background:var(--kok);
  border-bottom:1px solid var(--chiziq)}
.hero .q{position:relative;padding-top:38px;padding-bottom:38px}
.hero .lenta{display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:"Nekst";font-weight:700;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--oltin);margin-bottom:20px}
.hero .jang{display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:20px}
.hero .tomon{display:flex;flex-direction:column;align-items:center;gap:11px}
.hero .tomon img{width:78px;height:78px;object-fit:contain}
.hero .tomon .nomi{font-family:"Nekst";font-weight:700;font-size:17px;
  text-align:center}
.hero .orta{text-align:center}
.hero .orta .vs{font-family:"Nekst";font-weight:900;font-size:20px;
  color:rgba(255,255,255,.4);letter-spacing:.09em}
.hero .orta .hisob{font-family:"Nekst";font-weight:900;font-size:46px;
  line-height:1}
.hero .orta .sana{font-size:14px;color:rgba(255,255,255,.68);margin-top:8px}
.hero .past{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;
  margin-top:24px;padding-top:18px;
  border-top:1px solid rgba(255,255,255,.09);font-size:13.5px;
  color:rgba(255,255,255,.66)}
.hero .past b{font-family:"Nekst";font-weight:800;color:#fff}
.forma{display:inline-flex;gap:5px;vertical-align:middle}
.forma i{width:24px;height:24px;border-radius:7px;font-style:normal;
  display:flex;align-items:center;justify-content:center;
  font-family:"Nekst";font-weight:800;font-size:11.5px;color:#fff}
.forma i.g{background:#2ecc84}
.forma i.d{background:rgba(255,255,255,.18)}
.forma i.m{background:var(--qizil)}

/* --- FUTBOLCHI KARTOCHKASI --- */
.saf{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:14px}
.fk{background:var(--kok);border:1px solid var(--chiziq);border-radius:14px;
  overflow:hidden;transition:border-color .15s,transform .15s}
.fk:hover{border-color:var(--oltin);transform:translateY(-2px)}
.fk .rasm{height:158px;position:relative;overflow:hidden;
  background:rgba(0,0,0,.28)}
.fk .rasm img{position:absolute;left:50%;bottom:-4%;
  transform:translateX(-50%);height:112%;width:auto;max-width:none;
  object-fit:contain}
.fk .rasm .yoq{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-family:"Nekst";font-weight:900;font-size:30px;
  color:rgba(255,255,255,.13)}
.fk .raq{position:absolute;top:9px;left:10px;min-width:28px;height:26px;
  padding:0 7px;border-radius:8px;background:var(--qizil);color:#fff;
  font-family:"Nekst";font-weight:900;font-size:14px;display:flex;
  align-items:center;justify-content:center;z-index:2}
.fk .gol{position:absolute;top:9px;right:9px;padding:3px 8px;
  border-radius:7px;background:var(--oltin);color:var(--kok);
  font-family:"Nekst";font-weight:800;font-size:11px;z-index:2}
.fk .pas{padding:12px 13px 14px;border-top:1px solid rgba(255,255,255,.07)}
.fk .ism{font-family:"Nekst";font-weight:700;font-size:14px;line-height:1.28}
.fk .poz{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--oltin);margin-top:4px;font-family:"Nekst";font-weight:600;
  opacity:.85}
.fk .qosh{font-size:12px;color:rgba(255,255,255,.45);margin-top:3px}
.saf-guruh{margin-bottom:26px}
.saf-guruh > .sarl{font-family:"Nekst";font-weight:700;font-size:11.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--oltin);
  margin:0 0 13px;display:flex;align-items:center;gap:10px}
.saf-guruh > .sarl:after{content:"";flex:1;height:1px;
  background:rgba(255,255,255,.09)}
header{background:var(--kok);border-bottom:1px solid var(--chiziq);
  position:sticky;top:0;z-index:9}
header .q{display:flex;align-items:center;gap:14px;height:72px}
header img{height:44px;width:auto}
header b{font-family:"Nekst";font-weight:900;font-size:17px;
  letter-spacing:.02em;line-height:1.1;display:block}
header .sub{font-family:"Nekst";font-size:9.5px;letter-spacing:.16em;
  color:var(--oltin);display:flex;align-items:center;gap:5px}
header .sub i{width:5px;height:5px;border-radius:50%;
  background:var(--qizil);display:inline-block}
header nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
header nav a{font-family:"Nekst";font-weight:700;font-size:12.5px;
  letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.76);
  padding:8px 13px;border-radius:8px}
header nav a:hover,header nav a.faol{background:var(--qizil);color:#fff}
h1{font-family:"Nekst";font-weight:900;font-size:35px;line-height:1.15;
  letter-spacing:-.005em;margin:0 0 12px}
h2{font-family:"Nekst";font-weight:900;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--oltin);margin:38px 0 16px}
.lenta{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));
  gap:20px}
.kar{background:var(--kok);border:1px solid var(--chiziq);border-radius:14px;
  overflow:hidden;display:block;color:#fff}
.kar:hover{border-color:var(--oltin)}
.kar .rasm{aspect-ratio:16/9;background:rgba(0,0,0,.35);overflow:hidden}
.kar .rasm img{width:100%;height:100%;object-fit:cover}
.kar .ich{padding:15px 17px 18px}
.kar .tur{font-family:"Nekst";font-size:10px;font-weight:700;
  letter-spacing:.13em;color:var(--oltin);text-transform:uppercase}
.kar h3{font-family:"Nekst";font-weight:700;font-size:18px;line-height:1.3;
  margin:7px 0 8px}
.kar p{margin:0;font-size:14.5px;color:rgba(255,255,255,.66);line-height:1.55}
.kar .sana{font-size:12px;color:rgba(255,255,255,.4);margin-top:11px}
article{max-width:760px;margin:0 auto;padding:40px 20px 70px}
article .tur{font-family:"Nekst";font-size:11px;font-weight:700;
  letter-spacing:.14em;color:var(--oltin);text-transform:uppercase}
article .sana{color:rgba(255,255,255,.45);font-size:13.5px;margin:10px 0 26px}
article .muqova{border-radius:14px;overflow:hidden;margin-bottom:30px}
article p{margin:0 0 20px}
article p.savol{font-family:"Nekst";font-weight:700;color:var(--oltin);
  font-size:18px;margin-top:32px}
article .qisqa{font-size:19px;color:rgba(255,255,255,.82);
  border-left:3px solid var(--qizil);padding-left:16px;margin-bottom:28px}
footer{border-top:1px solid var(--chiziq);background:var(--kok);
  margin-top:60px;padding:26px 0;color:rgba(255,255,255,.5);font-size:13px}
footer .q{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.bosh-yoq{padding:70px 20px;text-align:center;color:rgba(255,255,255,.55)}
@media(max-width:640px){
  h1{font-size:26px}header .q{height:62px}header img{height:36px}
  .hero .tomon img{width:56px;height:56px}
  .hero .tomon .nomi{font-size:14px}
  .hero .orta .hisob{font-size:34px}
  .hero .jang{gap:12px}
  header nav a{padding:6px 9px;font-size:11px}
  article{padding:26px 18px 50px}
}
</style>
